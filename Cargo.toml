[package]
name = "polarity"
version = "0.0.1"
edition = "2024"
build = "build.rs"

[build-dependencies]
cc = "1.4.0"

[dependencies]
rfd = "0.17.2"
eframe = { version = "0.35.0" }
rodio = { version = "0.22.2", features = ["playback", "experimental"] }
env_logger = "0.11"
wgpu = { version = "29.0.4", features = ["dx12", "metal"] }
biquad = "0.6.0"
bytemuck = "1.25.0"
egui-winit = "0.35.0"
flume = "0.12.0"
pollster = "1.0.1"
ffmpeg-sidecar = "2.5.2"
serde_json = "1.0.150"
serde = { version = "1.0.229", features = ["derive"] }
rustfft = "6.4.1"
smart-default = "0.7.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSWorkspace",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSString",
    "NSURL",
] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
opt-level = 3
# strip = true
panic = "abort"
debug = true

[package.metadata.packager]
before-packaging-command = "cargo build --release"
product-name = "Polarity"
identifier = "com.odsp.polarity"
icons = []
version = "0.0.1"
copyright = "Copyright (c) Sohan Nair 2026. All rights reserved."
category = "Entertainment"
description = "An Audio Visualizer Application."
long-description = """
Polarity programmatically generates visuals from audio using a generator based architecture
"""

[[package.metadata.packager.deep-link-protocols]]
schemes = ["com.odsp.polarity"]

[package.metadata.packager.macos]
info-plist-path = "bundler_configs/Info.plist"
