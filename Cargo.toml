[package]
name = "polarity"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.34.3" }
egui = "0.34"
env_logger = "0.11"
wgpu = { version = "*", features = ["dx12", "metal"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# From docs:
[profile.release]
lto = "thin"
opt-level = "z"
strip = true
panic = "abort"
