[package]
name = "polarity"
version = "0.1.0"
edition = "2024"

[dependencies]
rfd = "0.17.2"
eframe = { version = "0.34.3" }
rodio = { version = "0.22.2", features = ["playback"] }
env_logger = "0.11"
wgpu = { version = "29.0.3", features = ["dx12", "metal"] }
biquad = "0.6.0"
bytemuck = "1.25.0"
egui-winit = "0.34.3"
flume = "0.12.0"
pollster = "1.0.1"
ffmpeg-sidecar = "2.5.2"
serde_json = "1.0.150"
serde = { version = "1.0.229", features = ["derive"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# From docs:
[profile.release]
lto = "thin"
opt-level = 3
strip = true

[package.metadata.bundle]
name = "Polarity"
identifier = "com.odsp.polarity"
icon = []
version = "0.0.1"
copyright = "Copyright (c) Sohan Nair 2026. All rights reserved."
category = "Entertainment"
short_description = "An Audio Visualizer Application."
long_description = """
Polarity programmatically generates visuals from audio using a generator based architecture
"""
osx_url_schemes = ["com.odsp.polarity"]
